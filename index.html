<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.10);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
    }

    .card-header {
      background: linear-gradient(135deg, #6c63ff, #48c6ef);
      padding: 1.5rem 1.5rem 1.25rem;
      color: #fff;
    }

    .card-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .remaining {
      margin-top: 0.35rem;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    .input-row {
      display: flex;
      gap: 0.5rem;
      padding: 1.25rem 1.25rem 0;
    }

    #todo-input {
      flex: 1;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      padding: 0.6rem 0.9rem;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
    }

    #todo-input:focus { border-color: #6c63ff; }

    #add-btn {
      background: #6c63ff;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1.1rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    #add-btn:hover { background: #574fd6; }
    #add-btn:active { transform: scale(0.97); }

    #todo-list {
      list-style: none;
      padding: 1rem 1.25rem 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      background: #f8f9fb;
      border: 1.5px solid #ececec;
      border-radius: 8px;
      padding: 0.65rem 0.85rem;
      transition: background 0.15s, border-color 0.15s;
    }

    .todo-item.completed {
      background: #f0fff4;
      border-color: #b7ebc8;
    }

    .todo-checkbox {
      appearance: none;
      -webkit-appearance: none;
      width: 20px;
      height: 20px;
      border: 2px solid #b0b0b0;
      border-radius: 50%;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: border-color 0.2s, background 0.2s;
    }

    .todo-checkbox:checked {
      background: #4caf7d;
      border-color: #4caf7d;
    }

    .todo-checkbox:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 8px;
      height: 5px;
      border-left: 2px solid #fff;
      border-bottom: 2px solid #fff;
      transform: rotate(-45deg);
    }

    .todo-text {
      flex: 1;
      font-size: 0.97rem;
      color: #333;
      word-break: break-word;
      transition: color 0.2s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #a0a0a0;
    }

    .delete-btn {
      background: none;
      border: none;
      cursor: pointer;
      color: #c0c0c0;
      font-size: 1.1rem;
      line-height: 1;
      padding: 0.15rem 0.3rem;
      border-radius: 4px;
      flex-shrink: 0;
      transition: color 0.2s, background 0.2s;
    }

    .delete-btn:hover { color: #e53935; background: #fdecea; }

    .empty-state {
      text-align: center;
      color: #b0b0b0;
      font-size: 0.95rem;
      padding: 1.5rem 0 0.5rem;
    }

    @media (max-width: 375px) {
      body { padding: 1rem 0.5rem; }
      .card-header { padding: 1.1rem 1rem 1rem; }
      .input-row { padding: 1rem 1rem 0; }
      #todo-list { padding: 0.75rem 1rem 1rem; }
    }
  </style>
</head>
<body>
  <div class="card">
    <header class="card-header">
      <h1>My Todos</h1>
      <p class="remaining" id="remaining-count">0 items remaining</p>
    </header>

    <div class="input-row">
      <input id="todo-input" type="text" placeholder="What needs to be done?" maxlength="200" aria-label="New todo" />
      <button id="add-btn" aria-label="Add todo">Add</button>
    </div>

    <ul id="todo-list" aria-label="Todo list"></ul>
  </div>

  <script>
    const STORAGE_KEY = 'zt-todos';

    let todos = load();

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render() {
      const list = document.getElementById('todo-list');
      const countEl = document.getElementById('remaining-count');
      const remaining = todos.filter(t => !t.done).length;

      countEl.textContent = remaining === 1 ? '1 item remaining' : `${remaining} items remaining`;

      if (todos.length === 0) {
        list.innerHTML = '<li class="empty-state">No todos yet — add one above!</li>';
        return;
      }

      list.innerHTML = '';
      todos.forEach((todo, i) => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.done ? ' completed' : '');

        const cb = document.createElement('input');
        cb.type = 'checkbox';
        cb.className = 'todo-checkbox';
        cb.checked = todo.done;
        cb.setAttribute('aria-label', 'Mark complete');
        cb.addEventListener('change', () => toggle(i));

        const span = document.createElement('span');
        span.className = 'todo-text';
        span.textContent = todo.text;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.innerHTML = '&#x2715;';
        del.setAttribute('aria-label', 'Delete todo');
        del.addEventListener('click', () => remove(i));

        li.appendChild(cb);
        li.appendChild(span);
        li.appendChild(del);
        list.appendChild(li);
      });
    }

    function addTodo() {
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      save();
      render();
      input.value = '';
      input.focus();
    }

    function toggle(i) {
      todos[i].done = !todos[i].done;
      save();
      render();
    }

    function remove(i) {
      todos.splice(i, 1);
      save();
      render();
    }

    document.getElementById('add-btn').addEventListener('click', addTodo);
    document.getElementById('todo-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    render();
  </script>
</body>
</html>
