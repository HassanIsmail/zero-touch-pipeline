<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 520px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .count {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .count span {
      font-weight: 600;
      color: #4f46e5;
    }

    .add-form {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .add-form input {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      outline: none;
      background: #fff;
      color: #111827;
      transition: border-color 0.2s;
    }

    .add-form input::placeholder { color: #9ca3af; }

    .add-form input:focus {
      border-color: #4f46e5;
    }

    .add-form button {
      padding: 12px 20px;
      background: #4f46e5;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s, transform 0.1s;
    }

    .add-form button:hover { background: #4338ca; }
    .add-form button:active { transform: scale(0.97); }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.2s, opacity 0.2s;
    }

    .todo-item.done {
      opacity: 0.65;
      border-color: #d1fae5;
      background: #f0fdf4;
    }

    /* Custom checkbox */
    .check-btn {
      flex-shrink: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s, border-color 0.2s;
    }

    .check-btn:hover { border-color: #4f46e5; }

    .todo-item.done .check-btn {
      background: #10b981;
      border-color: #10b981;
    }

    .check-btn svg { display: none; }
    .todo-item.done .check-btn svg { display: block; }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #111827;
      word-break: break-word;
      transition: color 0.2s;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #6b7280;
    }

    .delete-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      color: #d1d5db;
      border-radius: 6px;
      display: flex;
      align-items: center;
      transition: color 0.2s, background 0.2s;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: #fef2f2;
    }

    .empty {
      text-align: center;
      color: #9ca3af;
      font-size: 0.95rem;
      padding: 40px 0;
    }

    @media (max-width: 400px) {
      h1 { font-size: 1.6rem; }
      .add-form button { padding: 12px 14px; font-size: 0.9rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Todos</h1>
    <p class="count"><span id="remaining">0</span> item(s) remaining</p>

    <form class="add-form" id="add-form">
      <input
        type="text"
        id="todo-input"
        placeholder="What needs to be done?"
        autocomplete="off"
        maxlength="200"
      />
      <button type="submit">Add</button>
    </form>

    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <script>
    const STORAGE_KEY = 'zht-todos';

    let todos = load();

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render() {
      const list = document.getElementById('todo-list');
      const remaining = todos.filter(t => !t.done).length;
      document.getElementById('remaining').textContent = remaining;

      if (todos.length === 0) {
        list.innerHTML = '<li class="empty">No todos yet — add one above!</li>';
        return;
      }

      list.innerHTML = todos.map((todo, i) => `
        <li class="todo-item${todo.done ? ' done' : ''}" data-index="${i}">
          <button class="check-btn" aria-label="${todo.done ? 'Mark incomplete' : 'Mark complete'}" data-action="toggle" data-index="${i}">
            <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
              <path d="M1 5l3.5 3.5L11 1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <button class="delete-btn" aria-label="Delete todo" data-action="delete" data-index="${i}">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M2 4h12M5 4V2h6v2M6 7v5M10 7v5M3 4l1 9h8l1-9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </li>
      `).join('');
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    document.getElementById('add-form').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      save();
      render();
      input.value = '';
      input.focus();
    });

    document.getElementById('todo-list').addEventListener('click', e => {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;
      const index = parseInt(btn.dataset.index, 10);
      if (btn.dataset.action === 'toggle') {
        todos[index].done = !todos[index].done;
      } else if (btn.dataset.action === 'delete') {
        todos.splice(index, 1);
      }
      save();
      render();
    });

    render();
  </script>
</body>
</html>
