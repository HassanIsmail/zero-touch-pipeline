<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .container {
      width: 100%;
      max-width: 540px;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: #6b7280;
      margin-bottom: 24px;
    }

    .subtitle span {
      font-weight: 600;
      color: #4f46e5;
    }

    .input-row {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    #new-todo {
      flex: 1;
      padding: 12px 16px;
      font-size: 1rem;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      background: #fff;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
    }

    #new-todo:focus {
      border-color: #4f46e5;
    }

    #new-todo::placeholder {
      color: #9ca3af;
    }

    #add-btn {
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 600;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      white-space: nowrap;
    }

    #add-btn:hover {
      background: #4338ca;
    }

    #add-btn:active {
      transform: scale(0.97);
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: #fff;
      border: 2px solid #e5e7eb;
      border-radius: 10px;
      padding: 14px 16px;
      transition: border-color 0.15s, opacity 0.15s;
    }

    .todo-item.done {
      opacity: 0.6;
      border-color: #d1d5db;
    }

    .check-btn {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      border: 2px solid #d1d5db;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .check-btn:hover {
      border-color: #4f46e5;
    }

    .todo-item.done .check-btn {
      background: #4f46e5;
      border-color: #4f46e5;
    }

    .check-btn svg {
      display: none;
    }

    .todo-item.done .check-btn svg {
      display: block;
    }

    .todo-text {
      flex: 1;
      font-size: 1rem;
      color: #111827;
      word-break: break-word;
      transition: color 0.15s;
    }

    .todo-item.done .todo-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .delete-btn {
      flex-shrink: 0;
      width: 32px;
      height: 32px;
      border: none;
      background: transparent;
      border-radius: 6px;
      cursor: pointer;
      color: #9ca3af;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    .delete-btn:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #9ca3af;
      font-size: 0.95rem;
    }

    .empty-state svg {
      display: block;
      margin: 0 auto 12px;
      opacity: 0.4;
    }

    @media (max-width: 480px) {
      body {
        padding: 24px 12px;
      }

      h1 {
        font-size: 1.6rem;
      }

      #add-btn {
        padding: 12px 14px;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Todos</h1>
    <p class="subtitle"><span id="remaining-count">0</span> item(s) remaining</p>

    <div class="input-row">
      <input
        id="new-todo"
        type="text"
        placeholder="Add a new task…"
        maxlength="200"
        autocomplete="off"
      />
      <button id="add-btn" type="button">Add</button>
    </div>

    <ul class="todo-list" id="todo-list"></ul>
  </div>

  <script>
    const input = document.getElementById('new-todo');
    const addBtn = document.getElementById('add-btn');
    const list = document.getElementById('todo-list');
    const remainingCount = document.getElementById('remaining-count');

    let todos = [];

    function load() {
      try {
        const stored = localStorage.getItem('todos');
        todos = stored ? JSON.parse(stored) : [];
      } catch {
        todos = [];
      }
    }

    function save() {
      localStorage.setItem('todos', JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = '';

      if (todos.length === 0) {
        list.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/>
              <rect x="9" y="3" width="6" height="4" rx="1"/>
            </svg>
            No todos yet — add one above!
          </div>`;
        remainingCount.textContent = '0';
        return;
      }

      const remaining = todos.filter(t => !t.done).length;
      remainingCount.textContent = remaining;

      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.done ? ' done' : '');
        li.dataset.index = index;

        li.innerHTML = `
          <button class="check-btn" aria-label="${todo.done ? 'Mark incomplete' : 'Mark complete'}">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1.5,6 4.5,9 10.5,3"/>
            </svg>
          </button>
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <button class="delete-btn" aria-label="Delete todo">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="3,6 5,6 21,6"/>
              <path d="M19,6l-1,14a2,2,0,0,1-2,2H8a2,2,0,0,1-2-2L5,6"/>
              <path d="M10,11v6"/>
              <path d="M14,11v6"/>
              <path d="M9,6V4a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1v2"/>
            </svg>
          </button>`;

        li.querySelector('.check-btn').addEventListener('click', () => toggle(index));
        li.querySelector('.delete-btn').addEventListener('click', () => remove(index));

        list.appendChild(li);
      });
    }

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function addTodo() {
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      save();
      render();
      input.value = '';
      input.focus();
    }

    function toggle(index) {
      todos[index].done = !todos[index].done;
      save();
      render();
    }

    function remove(index) {
      todos.splice(index, 1);
      save();
      render();
    }

    addBtn.addEventListener('click', addTodo);
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') addTodo();
    });

    load();
    render();
  </script>
</body>
</html>
