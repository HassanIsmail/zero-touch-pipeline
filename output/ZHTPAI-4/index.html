<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Todo App</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
    }

    .container {
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.10);
      padding: 32px 28px;
      width: 100%;
      max-width: 480px;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #1a1a2e;
      margin-bottom: 4px;
    }

    .item-count {
      font-size: 0.875rem;
      color: #6b7280;
      margin-bottom: 24px;
      min-height: 20px;
    }

    .add-form {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
    }

    .add-form input {
      flex: 1;
      padding: 10px 14px;
      border: 1.5px solid #d1d5db;
      border-radius: 8px;
      font-size: 0.9375rem;
      color: #111827;
      outline: none;
      transition: border-color 0.15s;
    }

    .add-form input:focus {
      border-color: #6366f1;
    }

    .add-form input::placeholder {
      color: #9ca3af;
    }

    .btn-add {
      padding: 10px 20px;
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 0.9375rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, transform 0.1s;
    }

    .btn-add:hover {
      background: #4f46e5;
    }

    .btn-add:active {
      transform: scale(0.97);
    }

    .todo-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .todo-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 14px;
      border: 1.5px solid #e5e7eb;
      border-radius: 8px;
      background: #fafafa;
      transition: background 0.15s, border-color 0.15s;
    }

    .todo-item.completed {
      background: #f3f4f6;
      border-color: #d1d5db;
    }

    .todo-checkbox {
      flex-shrink: 0;
      width: 20px;
      height: 20px;
      border: 2px solid #6366f1;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, border-color 0.15s;
    }

    .todo-item.completed .todo-checkbox {
      background: #6366f1;
      border-color: #6366f1;
    }

    .todo-checkbox svg {
      display: none;
      width: 12px;
      height: 12px;
      stroke: #fff;
      stroke-width: 2.5;
      fill: none;
    }

    .todo-item.completed .todo-checkbox svg {
      display: block;
    }

    .todo-text {
      flex: 1;
      font-size: 0.9375rem;
      color: #111827;
      word-break: break-word;
      transition: color 0.15s;
    }

    .todo-item.completed .todo-text {
      text-decoration: line-through;
      color: #9ca3af;
    }

    .btn-delete {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      color: #d1d5db;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color 0.15s, background 0.15s;
    }

    .btn-delete:hover {
      color: #ef4444;
      background: #fee2e2;
    }

    .btn-delete svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
    }

    .empty-state {
      text-align: center;
      padding: 32px 0 8px;
      color: #9ca3af;
      font-size: 0.9375rem;
    }

    @media (max-width: 375px) {
      .container {
        padding: 24px 16px;
      }

      .btn-add {
        padding: 10px 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>My Todos</h1>
    <p class="item-count" id="item-count"></p>

    <form class="add-form" id="add-form" autocomplete="off">
      <input
        type="text"
        id="todo-input"
        placeholder="What needs to be done?"
        maxlength="200"
        aria-label="New todo text"
      />
      <button type="submit" class="btn-add">Add</button>
    </form>

    <ul class="todo-list" id="todo-list" aria-label="Todo list"></ul>
    <p class="empty-state" id="empty-state" style="display:none;">No todos yet. Add one above!</p>
  </div>

  <script>
    const STORAGE_KEY = 'ztp_todos';

    let todos = load();

    const form = document.getElementById('add-form');
    const input = document.getElementById('todo-input');
    const list = document.getElementById('todo-list');
    const countEl = document.getElementById('item-count');
    const emptyEl = document.getElementById('empty-state');

    function load() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
      } catch {
        return [];
      }
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(todos));
    }

    function render() {
      list.innerHTML = '';

      if (todos.length === 0) {
        emptyEl.style.display = 'block';
        countEl.textContent = '';
        return;
      }

      emptyEl.style.display = 'none';

      const remaining = todos.filter(t => !t.done).length;
      countEl.textContent = remaining === 1
        ? '1 item left'
        : remaining === 0
          ? 'All done!'
          : `${remaining} items left`;

      todos.forEach((todo, index) => {
        const li = document.createElement('li');
        li.className = 'todo-item' + (todo.done ? ' completed' : '');
        li.dataset.index = index;

        li.innerHTML = `
          <button class="todo-checkbox" aria-label="${todo.done ? 'Mark incomplete' : 'Mark complete'}" data-action="toggle">
            <svg viewBox="0 0 12 10" aria-hidden="true">
              <polyline points="1,5 4.5,9 11,1" />
            </svg>
          </button>
          <span class="todo-text">${escapeHtml(todo.text)}</span>
          <button class="btn-delete" aria-label="Delete todo" data-action="delete">
            <svg viewBox="0 0 16 16" aria-hidden="true">
              <line x1="3" y1="3" x2="13" y2="13" />
              <line x1="13" y1="3" x2="3" y2="13" />
            </svg>
          </button>
        `;

        list.appendChild(li);
      });
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.appendChild(document.createTextNode(str));
      return div.innerHTML;
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      const text = input.value.trim();
      if (!text) return;
      todos.push({ text, done: false });
      save();
      render();
      input.value = '';
      input.focus();
    });

    list.addEventListener('click', function (e) {
      const btn = e.target.closest('[data-action]');
      if (!btn) return;

      const li = btn.closest('.todo-item');
      if (!li) return;

      const index = parseInt(li.dataset.index, 10);
      if (isNaN(index) || index < 0 || index >= todos.length) return;

      const action = btn.dataset.action;

      if (action === 'toggle') {
        todos[index].done = !todos[index].done;
        save();
        render();
      } else if (action === 'delete') {
        todos.splice(index, 1);
        save();
        render();
      }
    });

    render();
  </script>
</body>
</html>
